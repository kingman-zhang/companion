spring:
  application:
    name: companion-api

  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080
  servlet:
    context-path: /

companion:
  jwt:
    expiration: 86400000  # 24 小时，各环境统一
