# ────────────────────────────────────────
# 生产环境
# 激活方式：SPRING_PROFILES_ACTIVE=prod
# 所有敏感配置必须通过环境变量注入，无硬编码兜底
#
# 必填环境变量：
#   MONGODB_URI      MongoDB 完整连接串
#   REDIS_HOST       Redis 主机地址
#   REDIS_PASSWORD   Redis 密码
#   JWT_SECRET       JWT 签名密钥（≥32字符）
#
# 可选环境变量：
#   REDIS_PORT       Redis 端口（默认 6379）
# ────────────────────────────────────────

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 5000ms

companion:
  jwt:
    secret: ${JWT_SECRET}

  logging:
    consoleOutJson: true       # JSON 格式输出到 stdout（容器日志）
    file:
      enabled: true            # 同时写到文件（供 CLS LogListener 采集）
      path: ${LOG_PATH:/app/logs}
      saveDay: 7
