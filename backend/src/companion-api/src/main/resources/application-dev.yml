# ────────────────────────────────────────
# 本地开发环境
# 激活方式：SPRING_PROFILES_ACTIVE=dev（bootstrap.yml 默认值）
# ────────────────────────────────────────

spring:
  data:
    mongodb:
      uri: mongodb://root:abc123456@localhost:27017/companion?authSource=admin&authMechanism=SCRAM-SHA-256&retryWrites=true&serverSelectionTimeoutMS=5000&connectTimeoutMS=10000
      auto-index-creation: false

  redis:
    host: 127.0.0.1
    port: 6379
    password: abc123456
    timeout: 5000ms
    redisson:
      config: |
        singleServerConfig:
          address: "redis://127.0.0.1:6379"
          password: "abc123456"
          connectionPoolSize: 10
          connectionMinimumIdleSize: 2

logging:
  level:
    com.kingman.companion: DEBUG
    org.springframework.data.mongodb: INFO

companion:
  jwt:
    secret: companion-dev-secret-key-must-be-at-least-32-chars-long
