spring:
  data:
    mongodb:
      uri: mongodb://root:abc123456@192.168.31.238:30001/companion?authSource=admin
      auto-index-creation: false
    redis:
      host: 192.168.31.238
      port: 30002
      password: abc123456
      timeout: 5000ms

logging:
  level:
    com.kingman.companion: DEBUG
    org.springframework.data.mongodb: INFO

companion:
  jwt:
    secret: companion-dev-secret-key-must-be-at-least-32-chars-long
  web:
    enableRequestResponseLog: true
    enableRequestWrapper: true
    enableResponseWrapper: true
    enableRecordResponseBody: false
    geoIp2:
      enabled: true